# One service = one container = one target repo. To drive more repos, run more
# stacks (e.g. `docker compose -p coder-otherrepo --env-file other.env up -d`),
# each with its own volumes.
#
# Configuration lives in `.env` (copy `.env.example`). It is loaded if present;
# anything unset falls back to the loop's built-in defaults. The required keys
# are TARGET_REPO, CLAUDE_CODE_OAUTH_TOKEN, and GIT_PAT — without TARGET_REPO the
# loop exits immediately with a clear error.
services:
  coder:
    build: .
    container_name: coder
    image: coder
    # Keep the loop running across crashes and host reboots; a manual `stop`
    # stays stopped.
    restart: unless-stopped
    # Load `.env` straight into the container environment. required: false means
    # the stack still comes up without the file (handy when the variables are
    # supplied by the shell or an orchestrator instead).
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist the checkout (no re-clone on restart) and the retry-count state
      # (quarantine counts survive restarts).
      - checkout:/data/checkout
      - state:/data/state

volumes:
  checkout:
  state:
